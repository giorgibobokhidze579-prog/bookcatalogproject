<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BookFinder — მოძებნე წიგნები სათაურით ან ავტორით, ნახე ყდები და შეინახე რჩეულები." />
    <meta name="theme-color" content="#64834f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://openlibrary.org" crossorigin />
    <link rel="preconnect" href="https://covers.openlibrary.org" />
    <link
      rel="preload"
      as="image"
      href="https://covers.openlibrary.org/b/id/10527843-M.jpg"
      fetchpriority="high"
    />
    <script>
      // API-ს ვითხოვთ React-ის ჩატვირთვამდე და პირველ ყდას მაშინვე ვატვირთინებთ
      window.__fictionPromise = fetch('https://openlibrary.org/subjects/fiction.json?limit=20')
        .then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(function (data) {
          var first = data.works && data.works[0];
          if (first && first.cover_id) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.fetchPriority = 'high';
            link.href = 'https://covers.openlibrary.org/b/id/' + first.cover_id + '-M.jpg';
            document.head.appendChild(link);
          }
          return data;
        });
    </script>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <title>BookFinder — წიგნების საძიებო საიტი</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
